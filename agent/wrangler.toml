# Cloudflare Worker asystenta AI. Wdrożenie (z folderu projektu):
#   npx wrangler login
#   npx wrangler secret put ANTHROPIC_API_KEY -c agent/wrangler.toml
#   npx wrangler deploy -c agent/wrangler.toml
# Adres z wyniku (https://portfolio-agent.<konto>.workers.dev) wpisz w content.js → shared.agent.endpoint.
name = "portfolio-agent"
main = "worker.js"
workers_dev = true      # adres https://portfolio-agent.teraz-platforma.workers.dev
preview_urls = false
compatibility_date = "2026-09-01"

[vars]
# Strony, które mogą pytać (po przecinku). localhost działa zawsze - do testów.
ALLOWED_ORIGINS = "https://lumerw.com,https://www.lumerw.com,https://lumerw.github.io"
# Model Claude. Taniej: claude-haiku-5-5 albo claude-sonnet-5-5.
MODEL = "claude-opus-5-5"
# Asystent w pluginie (Figma): dzienne limity, doba liczona wg UTC. Koszt w USD i pliki w MB, na użytkownika; TOTAL to suma całego serwera.
# Tokeny użytkowników: npx wrangler secret put FIGMA_TOKENS -c agent/wrangler.toml  (postać „nazwa:token,nazwa2:token2”)
FIGMA_DAILY_USD = "10"
FIGMA_TOTAL_DAILY_USD = "20"
FIGMA_DAILY_FILES_MB = "2000"

# Licznik kosztów asystenta w pluginie (agent/figma-usage.js). Durable Object na SQLite działa też w planie Free.
[[durable_objects.bindings]]
name = "FIGMA_USAGE"
class_name = "FigmaUsage"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["FigmaUsage"]

# Najwyżej 10 pytań na minutę z jednego adresu IP.
[[ratelimits]]
name = "LIMITER"
namespace_id = "1001"
simple = { limit = 10, period = 60 }

# Asystent w pluginie lumerw (Figma): jedna odpowiedź to kilka kroków z narzędziami - 60 zapytań na minutę.
[[ratelimits]]
name = "FIGMA_LIMITER"
namespace_id = "1002"
simple = { limit = 60, period = 60 }

# Załączniki czatu w pluginie (do 100 MB każdy): 20 plików na minutę z jednego adresu IP.
[[ratelimits]]
name = "FILE_LIMITER"
namespace_id = "1003"
simple = { limit = 20, period = 60 }
